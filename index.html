function wfm(){const w=wf(TG),a=A(),it=[['Prior quarter',w.yp,'t'],...w.cs.map(c=>[c.q.name,c.c,'d']),['Unexplained',w.res,'d'],['Last quarter',w.yl,'t']];let run=w.yp,pts=[];it.forEach(x=>{if(x[2]=='t')pts.push([0,x[1],x]);else{pts.push([run,run+x[1],x]);run+=x[1]}});
const all=pts.flatMap(p=>[p[0],p[1]]),lo=Math.min(...all,w.yp,w.yl)-.15*Math.abs(w.yl||1),hi=Math.max(...all)+.15*Math.abs(w.yl||1),Y=v=>230-(v-lo)/(hi-lo)*200,bw=560/pts.length;
$('wf').innerHTML=`<div class="c"><h2>Why did ${TN().toLowerCase()} change last quarter?</h2><div class="mt sm">Compares Aug–Oct with May–Jul (${TY[TG].u}). Each bar is the part of the change explained by one KPI, using the model’s lagged coefficients.</div><div class="sc"><svg viewBox="0 0 620 290" width="100%" style="min-width:520px">${pts.map((p,i)=>{const x=p[2],t=x[2]=='t',y1=Y(Math.max(p[0],p[1])),h=Math.max(2,Math.abs(Y(p[0])-Y(p[1]))),col=t?'var(--ac)':x[1]>=0?'#10b981':'#ef4444';const top=t?Y(x[1]):y1;return`<rect x="${42+i*bw}" y="${t?Y(x[1]):y1}" width="${bw-8}" height="${t?230-Y(x[1]):h}" rx="3" fill="${x[0]=='Unexplained'?'#94a3b8':col}"/><text x="${42+i*bw+(bw-8)/2}" y="${top-4}" text-anchor="middle">${t?x[1].toFixed(2):f2(x[1])}</text><text x="${42+i*bw+(bw-8)/2}" y="250" text-anchor="middle">${x[0].split(' ').slice(0,2).join(' ')}</text><text x="${42+i*bw+(bw-8)/2}" y="262" text-anchor="middle">${x[0].split(' ').slice(2).join(' ')}</text>`}).join('')}</svg></div></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Narrative</h3><div class="ins">${TN()} went from <b>${w.yp.toFixed(2)}</b> to <b>${w.yl.toFixed(2)}</b> ${TY[TG].u} (${f2(w.yl-w.yp)}).</div>${w.cs.slice(0,3).map(c=>`<div class="ins"><b>${c.q.name}</b> (${c.q.dept}) contributed <b>${f2(c.c)}</b>. It leads by ${c.q.lag} month(s), so decisions made then are showing up now.</div>`).join('')}<div class="ins"><b>${pc(Math.abs(w.res)/Math.max(.001,Math.abs(w.yl-w.yp)))}</b> of the change is unexplained by tracked KPIs: investigate external factors.</div></div>
<div class="c"><h3>Evidence table</h3><table><tr><th>KPI</th><th>Lag</th><th>r</th><th>β (σ)</th><th>Contribution</th></tr>${w.cs.map(c=>`<tr><td>${c.q.name}</td><td>${c.q.lag}m</td><td>${f2(c.q.r)}</td><td>${f2(c.q.b)}</td><td><b class="${c.c>=0?'up':'dn'}">${f2(c.c)}</b></td></tr>`).join('')}</table><div class="sm mt" style="margin-top:8px">Correlation-based attribution, not proof of causation. Model R² ${pc(a.r2)}.</div></div></div>`}
function scm(){const a=A();$('sc').innerHTML=`<div class="g g2"><div class="c"><h2>Scenario planner</h2><div class="mt sm">Shift each driver by up to ±2 standard deviations and see the expected effect on ${TN().toLowerCase()} over the next 6 months.</div>${a.sel.map((q,j)=>`<div style="margin:12px 0"><div class="sm"><span class="dot" style="background:${DCOL[q.dept]}"></span><b>${q.name}</b> <span class="mt">(${q.lag}m lead, β ${f2(q.b)})</span>: <b id="sv${j}">${(SCN[q.i]||0).toFixed(1)}σ</b></div><input type="range" min="-2" max="2" step=".5" value="${SCN[q.i]||0}" data-j="${j}"></div>`).join('')}<button class="btn" id="srs">Reset</button></div><div class="c" id="sres"></div></div>`;
document.querySelectorAll('#sc input').forEach(e=>e.oninput=()=>{SCN[a.sel[+e.dataset.j].i]=+e.value;$('sv'+e.dataset.j).textContent=(+e.value).toFixed(1)+'σ';scr()});$('srs').onclick=()=>{SCN={};scm()};scr()}
function scr(){const a=A(),T=TY[TG],d=sum(a.sel.map(q=>q.b*a.sy*(SCN[q.i]||0))),cum=d*6,lv=T.L[35],isp=TG!='gm',val=isp?lv*cum/100:0,base=TG=='rev'?Rv[35]:0;
$('sres').innerHTML=`<h3>Projected effect</h3><div class="big ${d>=0?'up':'dn'}">${f2(d)} ${T.u}</div><div class="mt sm">Extra change per month once lagged effects land</div><div class="ins">Over 6 months: <b>${f2(cum)} ${TG=='gm'?'pts':'%'}</b> cumulative${isp?` ≈ <b class="${val>=0?'up':'dn'}">${(val>=0?'+':'')+val.toFixed(1)} Cr</b> on current ${TG=='eb'?'EBITDA':'monthly revenue'} of ${fm(lv)}`:` (${f2(cum*Rv[35]/100)} Cr gross profit per month at current revenue)`}.</div><h3 style="margin-top:14px">Per-driver contribution</h3>${a.sel.map(q=>{const v=q.b*a.sy*(SCN[q.i]||0);return`<div class="row"><div class="l">${q.name}</div><div class="bar"><i style="width:${Math.min(100,Math.abs(v)/(a.sy*.8)*100)}%;background:${v>=0?'#10b981':'#ef4444'}"></i></div><div class="v">${f2(v)}</div></div>`}).join('')}<div class="sm mt">Effects arrive after each KPI’s lead time (${a.sel.map(q=>q.lag+'m').join(', ')}). Assumes the observed relationships stay stable.</div>`}
// ---- agent ----
const CH=['Give me an executive briefing','What drives revenue?','Why did EBITDA change last quarter?','Which KPIs are vanity metrics?','What should we do?','How reliable is this model?'];
function agm(){$('ag').innerHTML=`<div class="g g2" style="grid-template-columns:2fr 1fr"><div class="c"><h3>🤖 Decision Intelligence Agent</h3><div class="chat" id="chat"><div class="m b">Hello! I’ve linked 24 operational KPIs to revenue, margin and EBITDA. Ask what drives performance, why something changed, which KPIs to ignore, or test a scenario like “what if win rate +1σ”.</div></div><div class="in"><input id="q" placeholder="Ask about drivers, changes, vanity KPIs, actions…"><button id="go">Send</button></div></div>
<div class="c"><h3>Try asking</h3><div class="chips">${CH.map(c=>`<button onclick="ask(this.textContent)">${c}</button>`).join('')}</div><h3 style="margin-top:16px">Agent pipeline</h3><div class="sm mt">1. Ingest KPIs + financials<br>2. Detrend and standardise<br>3. Lead-lag correlation scan<br>4. Vanity-metric filter<br>5. Multi-driver regression<br>6. Contribution analysis<br>7. Evidence-backed insight text</div></div></div>`;
$('go').onclick=()=>{const v=$('q').value.trim();if(v){$('q').value='';ask(v)}};$('q').onkeydown=e=>{if(e.key=='Enter')$('go').click()}}
function reply(q){const tg=/ebitda|profit/i.test(q)?'eb':/margin|gross/i.test(q)?'gm':/revenue|sales growth|growth/i.test(q)?'rev':TG,a=an(tg),n=TY[tg].n,ki=KW.findIndex(k=>new RegExp(k,'i').test(q));let st,h;
if(ki>=0&&/what.?if|\bif\b|[+\-]\s?\d|improve|increase|reduce|boost/i.test(q)){const r=a.rows[ki],m=q.match(/([+\-]?\s?\d+(\.\d+)?)\s*σ|\b([+\-]\s?\d+(\.\d+)?)/),sg=m?parseFloat((m[1]||m[3]).replace(' ','')):1,inSel=a.sel.includes(r),d=inSel?r.b*a.sy*sg:r.r*a.sy*sg*.5;st=['Locating '+r.name,'Applying coefficient with '+r.lag+'-month lag'];h=`A <b>${sg>0?'+':''}${sg}σ</b> move in <b>${r.name}</b> is expected to shift ${n.toLowerCase()} by about <b>${f2(d)} ${TY[tg].u}</b> after ${r.lag} month(s) (${inSel?'model coefficient':'weak single-variable estimate'}, r = ${f2(r.r)}). ${r.cls!='Driver'?'Evidence is weak: treat with caution.':''}`}
else if(/vanity|spurious|misleading|noise|ignore|useless/i.test(q)){const v=a.rows.filter(r=>r.cls=='Vanity').sort((x,y)=>Math.abs(y.lv)-Math.abs(x.lv));st=['Comparing level vs change correlations','Flagging trend-driven KPIs'];h=`<b>Vanity KPIs for ${n}</b> (look important, are not):<table><tr><th>KPI</th><th>Level r</th><th>Change r</th></tr>${v.map(r=>`<tr><td>${r.name}</td><td>${f2(r.lv)}</td><td>${f2(r.r)}</td></tr>`).join('')||'<tr><td colspan=3>None found</td></tr>'}</table>They share an upward trend with the business, so reports show a “link” that vanishes once trend is removed. Consider dropping them from executive scorecards.`}
else if(/why|change|moved|last quarter|decompos|explain the/i.test(q)&&!/drive/i.test(q)){const w=wf(tg);st=['Splitting Aug–Oct vs May–Jul','Attributing change to lagged KPIs'];h=`${n} moved <b>${w.yp.toFixed(2)} → ${w.yl.toFixed(2)}</b> ${TY[tg].u}.<br>${w.cs.slice(0,3).map(c=>`• <b>${c.q.name}</b> (${c.q.dept}): ${f2(c.c)}`).join('<br>')}<br>• Unexplained: ${f2(w.res)}<br>See the “Why it changed” tab for the waterfall.`}
else if(/drive|driver|matter|important|which kpi|explain/i.test(q)){st=['Scanning 24 KPIs × 5 lags','Fitting 5-driver regression'];h=`<b>Top drivers of ${n}</b> (R² ${pc(a.r2)}):<table><tr><th>KPI</th><th>Dept</th><th>Lead</th><th>r</th><th>β</th></tr>${a.sel.map(r=>`<tr><td>${r.name}</td><td>${r.dept}</td><td>${r.lag}m</td><td>${f2(r.r)}</td><td>${f2(r.b)}</td></tr>`).join('')}</table>Only ${a.nd} of 24 KPIs pass the significance bar.`}
else if(/depart|team|function|who owns/i.test(q)){const dep={};a.sel.forEach(r=>dep[r.dept]=(dep[r.dept]||0)+Math.abs(r.b));const o=Object.entries(dep).sort((x,y)=>y[1]-x[1]);st=['Aggregating model weight by department'];h=`For ${n}, influence ranks: ${o.map(([d,v])=>`<b>${d}</b> (${v.toFixed(2)})`).join(' › ')}. Focus executive reviews on these functions’ leading indicators.`}
else if(/recommend|action|priorit|focus|decision|should we/i.test(q)){st=['Ranking drivers by effect size','Checking controllability'];h=`<b>Recommended actions for ${n}</b><br>${a.sel.slice(0,3).map((r,i)=>`${i+1}. ${r.b>=0?'Raise':'Reduce'} <b>${r.name}</b> (${r.dept}). +1σ ≈ ${f2(Math.abs(r.b)*a.sy)} ${TY[tg].u} after ${r.lag}m.`).join('<br>')}<br>${a.rows.filter(r=>r.cls=='Vanity').slice(0,2).map(r=>`• Stop steering by <b>${r.name}</b>: trend-only signal.`).join('<br>')}<br>Test in the Scenario planner before committing budget.`}
else if(/reliab|confiden|accura|trust|r2|r-squared|model|robust/i.test(q)){st=['Reading model diagnostics'];h=`R² ${pc(a.r2)}, adjusted ${pc(a.ar2)}, ${a.n} monthly observations, 5 predictors, significance threshold |r| ≥ 0.36. <b>Caveats:</b> correlation is not causation; small sample; relationships may shift. Validate with A/B tests or pilots before large bets.`}
else if(ki>=0){const r=a.rows[ki];st=['Loading '+r.name];h=`<b>${r.name}</b> (${r.dept}, ${r.u}): verdict <b>${r.cls}</b> for ${n}. Best lag ${r.lag}m, change r ${f2(r.r)}, level r ${f2(r.lv)}.${r.cls=='Vanity'?' It trends with the business but does not explain changes.':''}`}
else if(/brief|summar|overview|exec|insight/i.test(q)){st=['Scanning outcomes','Generating evidence-based insights'];h=`<b>Executive briefing: ${n}</b><br>`+brief().map(b=>'• '+b).join('<br>')}
else{st=['Parsing intent'];h='I can explain drivers, decompose last quarter’s change, flag vanity KPIs, rank departments, run what-ifs (e.g. “win rate +1σ”) and recommend actions. Add “revenue”, “margin” or “EBITDA” to pick the outcome.'}
return{st,h}}
function ask(q){document.querySelector('[data-t=ag]').click();const c=$('chat'),u=document.createElement('div');u.className='m u';u.textContent=q;c.appendChild(u);const b=document.createElement('div');b.className='m b';c.appendChild(b);const r=reply(q);let i=0;
const nx=()=>{if(i<r.st.length){b.innerHTML+=`<div class="step"><b>✓</b> ${r.st[i++]}…</div>`;c.scrollTop=1e5;setTimeout(nx,420)}else{b.innerHTML+=`<div style="margin-top:6px">${r.h}</div>`;c.scrollTop=1e5}};b.innerHTML='<div class="step">⚙ Agent thinking…</div>';setTimeout(()=>{b.innerHTML='';nx()},300)}
const VW={ov:ovw,dr:drm,wf:wfm,sc:scm,ag:agm};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{CUR=b.dataset.t;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x==b));Object.keys(VW).forEach(k=>$(k).hidden=k!=CUR);if(CUR!='ag'||!$('chat'))VW[CUR]()});
document.querySelectorAll('#tg button').forEach(b=>b.onclick=()=>{TG=b.dataset.g;SK=null;SCN={};document.querySelectorAll('#tg button').forEach(x=>x.classList.toggle('on',x==b));if(CUR!='ag')VW[CUR]()});
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
ovw();
</script></body></html>
